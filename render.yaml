services:
  - type: web
    name: ortometric-api
    env: python
    rootDir: api
    buildCommand: pip install -r requirements.txt && flask --app wsgi db upgrade
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://your-frontend.vercel.app
